    notes: >
      MEASUREMENT ANOMALY, recorded rather than published. The reported TTFT of
      200.59s is roughly 71x the stated tier median of 2.82s. A genuine 200-second
      wait before the first token would make interactive use impossible, which
      contradicts every other property recorded for this model.

      The likely cause is definitional, not an error: the publisher's own
      methodology defines TTFT as "the time in seconds between sending a request
      to the service and receiving the first token of the response." For a model
      that reasons before emitting a visible response, that interval includes the
      entire reasoning phase. The metric is measuring something real; it is not
      measuring what the name implies, and it is not comparable to the same metric
      on a non-reasoning model.

      Consequence: output speed is admissible. TTFT is recorded as contested and
      does NOT enter the D8 score. See clm-model-claude-sonnet-5-d8-ttft.
