        text: >-
          gpt-5.6-sol: Input $5.00 | Cached input $0.50 | Output $30.00.
          gpt-5.6-terra: Input $2.00 | Cached input $0.20 | Output $12.00.
          gpt-5.6-luna: Input $0.20 | Cached input $0.02 | Output $1.20.
      - id: 1
        locator: "Premium models"
        text: >-
          gpt-5.5-pro (<272K context): Input $30.00 | Output $180.00.
          o3-pro: Input $20.00 | Output $80.00.
      - id: 2
        locator: "Economical options"
        text: >-
          gpt-5-nano: Input $0.05 | Cached input $0.005 | Output $0.40.
          gpt-4o-mini: Input $0.15 | Cached input $0.075 | Output $0.60.
      - id: 3
        locator: "Batch pricing"
        text: >-
          Batch processing cuts Standard rates in half.
      - id: 4
        locator: "Regional processing note"
        text: >-
          Regional processing (data residency) endpoints are charged a 10%
          uplift for models released on or after March 5, 2026.
