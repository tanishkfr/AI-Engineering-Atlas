      - id: 0
        locator: "Gemini 3.6 Flash — standard paid tier, per 1M tokens"
        text: >-
          gemini-3.6-flash. Input price: $1.50. Output price (including thinking
          tokens): $7.50. Context caching price: $0.15 and $1.00 / 1,000,000
          tokens per hour (storage price).
      - id: 1
        locator: "Gemini 3.6 Flash — batch and flex tiers"
        text: >-
          Batch: Input price $0.75, Output price (including thinking tokens)
          $3.75, Context caching $0.075 plus $1.00/1M tokens per hour storage.
          Flex: Input $0.75, Output $3.75, Caching $0.075 plus $1.00/hr storage.
      - id: 2
        locator: "Gemini 3.6 Flash — priority tier"
        text: >-
          Priority: Input price $2.70. Output price (including thinking tokens):
          $13.50. Context caching price $0.27 and $1.00 / 1,000,000 tokens per
          hour.
      - id: 3
        locator: "Gemini 3.5 Flash"
        text: >-
          gemini-3.5-flash. Standard: Input $1.50, Output $9.00, Caching $0.15
          plus $1.00/hr. Batch: Input $0.75, Output $4.50. Priority: Input
          $2.70, Output $16.20.
    methodology: null
    notes: >
      REDUCED FIDELITY — individual figures quoted but page structure rebuilt by
      the extraction model. Notably, only Flash-tier models were returned; the
      Pro tier was not captured and its absence here is a COVERAGE GAP, not
      evidence that it does not exist. Re-capture required (T-090).
      Google's four-tier structure (standard / batch / flex / priority) plus
      per-hour cache STORAGE billing is a materially different pricing shape from
      Anthropic's and OpenAI's, and the cost model must represent it — see
      research gap RG-004.
