  - id: src-mcp-spec-2025-06-18-2026-08-04
    schema_version: 1
    class: A
    url: https://modelcontextprotocol.io/specification/2025-06-18
    canonical_url: https://modelcontextprotocol.io/specification/2025-06-18
    archive_url: http://web.archive.org/web/20260727063112/https://modelcontextprotocol.io/specification/2025-06-18
    archive_status: archived
    title: Model Context Protocol — Specification (2025-06-18)
    publisher: ent-institution-mcp-governance
    published: 2025-06-18
    retrieved: 2026-08-04
    content_hash: sha256:0d6bf53b64b74ed53248a0b17fb52aca9333e5ba317f66787284a9cf24fa819f
    hash_status: hashed
    reverification: hash_triggered
    excerpt_fidelity: verbatim
    flags: []
    excerpts:
      - id: 0
        locator: "Overview"
        text: >-
          MCP is an open protocol that enables seamless integration between LLM
          applications and external data sources and tools. The protocol uses
          JSON-RPC 2.0 messages to establish communication between Hosts (LLM
          applications that initiate connections), Clients (connectors within the
          host application), and Servers (services that provide context and
          capabilities).
      - id: 1
        locator: "Key Details — Base Protocol"
        text: >-
          JSON-RPC message format. Stateful connections. Server and client
          capability negotiation.
      - id: 2
        locator: "Features"
        text: >-
          Servers offer any of the following features to clients: Resources
          (context and data), Prompts (templated messages and workflows), Tools
          (functions for the AI model to execute). Clients may offer the following
          features to servers: Sampling, Roots, Elicitation.
      - id: 3
        locator: "Security and Trust & Safety — Tool Safety"
        text: >-
          Tools represent arbitrary code execution and must be treated with
          appropriate caution. In particular, descriptions of tool behavior such
          as annotations should be considered untrusted, unless obtained from a
          trusted server. Hosts must obtain explicit user consent before invoking
          any tool.
      - id: 4
        locator: "Implementation Guidelines"
        text: >-
          While MCP itself cannot enforce these security principles at the
          protocol level, implementors SHOULD build robust consent and
          authorization flows into their applications.
      - id: 5
        locator: "Specification basis"
        text: >-
          This specification defines the authoritative protocol requirements,
          based on the TypeScript schema in schema.ts (2025-06-18).
    methodology: null
    notes: >
      This is the 2025-06-18 revision, retrieved at a version-pinned URL. It is
      NOT established that this is the current revision as of 2026-08-04 — the
      M1 scan indicated governance moved to a foundation in Dec 2025 with a 2026
      roadmap. Version currency is an open question (RQ-13).

