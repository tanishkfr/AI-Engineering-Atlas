  - id: src-claude-code-overview-2026-08-04
    schema_version: 1
    class: A
    url: https://code.claude.com/docs/en/overview
    canonical_url: https://code.claude.com/docs/en/overview
    archive_url: http://web.archive.org/web/20260803085911/https://code.claude.com/docs/en/overview
    archive_status: archived
    title: Claude Code — Overview
    publisher: ent-institution-anthropic
    published: null
    retrieved: 2026-08-04
    content_hash: sha256:43644218b1478e6a084d0e17d57d857ba59f5c34931f17b2e64e52e5de5f88c3
    hash_status: hashed
    reverification: hash_triggered
    excerpt_fidelity: verbatim
    flags: [self_interested]
    excerpts:
      - id: 0
        locator: "Opening definition"
        text: >-
          Claude Code is an agentic coding tool that reads your codebase, edits
          files, runs commands, and integrates with your development tools.
          Available in your terminal, IDE, desktop app, and browser.
      - id: 1
        locator: "Get started — surfaces"
        text: >-
          Claude Code runs on several surfaces: the terminal, IDE extensions, a
          desktop app, and the web. Most surfaces require a Claude subscription
          or Anthropic Console account. The Terminal CLI and VS Code also support
          third-party providers.
      - id: 2
        locator: "Pipe, script, and automate with the CLI"
        text: >-
          Claude Code is composable and follows the Unix philosophy. Pipe logs
          into it, run it in CI, or chain it with other tools.
          Example: tail -200 app.log | claude -p "Slack me if you see any anomalies"
      - id: 3
        locator: "Connect your tools with MCP"
        text: >-
          The Model Context Protocol (MCP) is an open standard for connecting AI
          tools to external data sources. With MCP, Claude Code can read your
          design docs in Google Drive, update tickets in Jira, pull data from
          Slack, or use your own custom tooling.
      - id: 4
        locator: "Customize with instructions, skills, and hooks"
        text: >-
          CLAUDE.md is a markdown file you add to your project root that Claude
          Code reads at the start of every session. Claude also builds auto memory
          as it works, saving learnings like build commands and debugging insights
          across sessions. Hooks let you run shell commands before or after Claude
          Code actions.
      - id: 5
        locator: "Run agent teams and build custom agents"
        text: >-
          Spawn multiple Claude Code agents that work on different parts of a task
          simultaneously. A lead agent coordinates the work, assigns subtasks, and
          merges results. For fully custom workflows, the Agent SDK lets you build
          your own agents powered by Claude Code's tools and capabilities, with
          full control over orchestration, tool access, and permissions.
      - id: 6
        locator: "Schedule recurring tasks"
        text: >-
          Routines run on Anthropic-managed infrastructure, so they keep running
          even when your computer is off. They can also trigger on API calls or
          GitHub events. Desktop scheduled tasks run on your machine.
      - id: 7
        locator: "Use Claude Code everywhere — integration table"
        text: >-
          Push events from Telegram, Discord, iMessage, or my own webhooks into a
          session → Channels. Route bug reports from Slack to pull requests → Slack.
      - id: 8
        locator: "Use Claude Code everywhere"
        text: >-
          Each surface connects to the same underlying Claude Code engine, so your
          CLAUDE.md files, settings, and MCP servers work across all of them.
    methodology: null

