    hash_status: hashed
    reverification: hash_triggered
    excerpt_fidelity: tool_extracted
    flags: []
    excerpts:
      - id: 0
        locator: "Definition"
        text: >-
          SWE-bench is a benchmark for evaluating large language models on real
          world software issues collected from GitHub. Given a codebase and an
          issue, a language model is tasked with generating a patch that resolves
          the described problem.
      - id: 1
        locator: "Verified subset"
        text: >-
          SWE-bench Verified: A subset of 500 problems that real software
          engineers have confirmed are solvable.
      - id: 2
        locator: "Evaluation resource requirements"
        text: >-
          SWE-bench evaluation can be resource intensive. We recommend running on
          an x86_64 machine with at least 120GB of free storage, 16GB of RAM, and
          8 CPU cores. Support for arm64 machines is experimental.
    methodology:
      published: true
      url: https://github.com/SWE-bench/SWE-bench
      contamination_risk: high
    notes: >
      Full-set instance count NOT stated in the README and therefore NOT recorded.
      The M1 scan mentioned a figure; that was Class E and is not admissible.

