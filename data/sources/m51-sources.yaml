    excerpts:
      - id: 0
        locator: "deepseek-v4-flash pricing"
        text: >-
          deepseek-v4-flash: 1M INPUT TOKENS (CACHE HIT) $0.0028; 1M INPUT TOKENS
          (CACHE MISS) $0.14; 1M OUTPUT TOKENS $0.28.
      - id: 1
        locator: "deepseek-v4-pro pricing"
        text: >-
          deepseek-v4-pro: 1M INPUT TOKENS (CACHE HIT) $0.003625; 1M INPUT TOKENS
          (CACHE MISS) $0.435; 1M OUTPUT TOKENS $0.87.
      - id: 2
        locator: "Context and output limits"
        text: >-
          Both models support 1M tokens of context with a maximum output of 384K
          tokens.
      - id: 3
        locator: "Peak pricing"
        text: >-
          During peak hours, prices will be 2x the regular prices. Peak hours are
          9:00-12:00 and 14:00-18:00 (Beijing Time, UTC+8) daily. This policy's
          effective date will be subject to the official announcement.
    methodology: null
    notes: >
      Introduces TIME-OF-DAY price variation, a pricing shape the cost model
      cannot currently express. See RQ-14 and delta D-006.
