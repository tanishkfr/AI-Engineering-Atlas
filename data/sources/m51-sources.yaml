    hash_status: hashed
    reverification: hash_triggered
    excerpt_fidelity: tool_extracted
    flags: []
    excerpts:
      - id: 0
        locator: "Definition"
        text: >-
          A simple, open format for guiding coding agents. A dedicated,
          predictable place to provide the context and instructions to help AI
          coding agents work on your project.
      - id: 1
        locator: "Placement and resolution"
        text: >-
          At the root of the repository. For monorepos, place another AGENTS.md
          inside each package. Agents automatically read the nearest file in the
          directory tree, so the closest one takes precedence and every
          subproject can ship tailored instructions.
      - id: 2
        locator: "Supporting products list"
        text: >-
          OpenAI Codex, Google Jules, Factory, Aider, goose, opencode, Zed, Warp,
          VS Code, Devin (Cognition), UiPath Autopilot & Coded Agents, JetBrains
          Junie, Amp, Cursor, RooCode, Google Gemini CLI, Kilo Code, Phoenix,
          Semgrep, GitHub Copilot Coding Agent, Ona, Windsurf (Cognition),
          Augment Code
      - id: 3
        locator: "Standards status"
        text: >-
          Now stewarded by the Agentic AI Foundation under the Linux Foundation.
    methodology: null

