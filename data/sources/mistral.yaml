      NEGATIVE CAPTURE. This page does NOT carry a per-model price table at the
      URL retrieved. The single figure present is an illustrative FAQ example
      that names "Mistral Large" without a version.

      Recorded deliberately rather than discarded: a captured absence is a fact
      about the vendor's disclosure, and it prevents a future pass from assuming
      the page was simply never checked. The figure is NOT attributed to
      Mistral Large 3 — versionless examples cannot be assigned to a version.

      Detailed pricing is referenced at /pricing/api, uncaptured.
