    flags: [self_interested]
    excerpts:
      - id: 0
        locator: "General purpose models"
        text: >-
          Mistral Medium 3.5 — "Our frontier-class multimodal model optimized for
          agentic and coding use cases." (v26.04, Modified MIT license).
          Mistral Small 4 — "Hybrid model unifying instruct, reasoning, and
          coding in a single efficient model." (v26.03, Apache 2.0).
          Mistral Large 3 — "A state-of-the-art, open-weight, general-purpose
          multimodal model." (v25.12, Apache 2.0).
      - id: 1
        locator: "Specialized models"
        text: >-
          Codestral (v25.08) — "Our cutting-edge language model for code
          completion released end of July 2025" (Premier tier). Codestral Embed
          (v25.05). Ministral 3 family — 3B, 8B and 14B variants (v25.12,
          Apache 2.0).
    methodology: null
    notes: >
      First source in the corpus carrying explicit LICENCE terms per model. This
      converts openness from a category assumption into a sourced fact — and by
      contrast exposes that Kimi K3 and DeepSeek V4 remain openness: unknown
      because no equivalent evidence was captured for them.

      Context windows and pricing are NOT on this page.

