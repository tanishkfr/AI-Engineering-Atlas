  - id: clm-claude-sonnet-5-021
    schema_version: 2
    type: M
    temporal_kind: measurement
    subject: ent-model-claude-sonnet-5
    predicate: performance.time_to_first_token
    statement: >
      Time-to-first-token is NOT established. The one available measurement
      reports 200.59s against a tier median of 2.82s — a 71x outlier that would
      make interactive use impossible if taken at face value.
    value: unknown
    conditions:
      harness: null
      config: "publisher defines TTFT as request-sent to first-token-received"
      date: 2026-08-04
      operator: "Artificial Analysis"
      runs: 1
    qualifiers: {via: "first-party API"}
    temporal:
      valid_from: 2026-08-04
      valid_to: null
      valid_precision: day
      asserted_from: 2026-08-04
      asserted_to: null
      observed_at: 2026-08-04
    evidence:
      - {source: src-artificialanalysis-sonnet5-2026-08-04, excerpt_ref: 1, supports: false}
    conflicts:
      - positions:
          - statement: "TTFT is 200.59s as measured and published"
            sources: [src-artificialanalysis-sonnet5-2026-08-04]
          - statement: "A 200-second first token contradicts every other recorded property of this model and its documented interactive use"
            sources: [src-artificialanalysis-sonnet5-2026-08-04]
        likely_cause: measurement_definition
        note: >
          Not an error by the publisher. Their methodology defines TTFT as the
          interval from request sent to first token received. For a model that
          reasons before emitting a visible response, that interval contains the
          whole reasoning phase.

          The metric measures something real and does not measure what its name
          implies. TTFT is therefore NOT COMPARABLE between reasoning and
          non-reasoning models under this definition — a construct-validity
          problem in the metric, of the same kind already recorded against
          repository-patching benchmarks.

          Excluded from the D8 score. Raised as RQ-32.
    cadence_days: 60
    status: published

  # ─── KNOWN UNKNOWNS (publishable) ───
  - id: clm-claude-sonnet-5-090
    schema_version: 2
    type: M
    temporal_kind: measurement
    subject: ent-model-claude-sonnet-5
    predicate: measurement.tokenizer_inflation_factor
    statement: >
      Whether Sonnet 5 uses the newer tokenizer (~30% more tokens for the same
      text) is NOT established. Anthropic documents the change as applying to
      "Claude 4.7 and later models"; Sonnet 5 is later than 4.7 by name, but the
      documentation names Sonnet 4.6 and earlier as using the previous tokenizer
      and does not list Sonnet 5 explicitly either way.
    value: unknown
    conditions:
      harness: null
      date: 2026-08-03
    qualifiers: {via: null}
    temporal:
      valid_from: 2026-08-03
      valid_to: null
      valid_precision: day
      asserted_from: 2026-08-03
      asserted_to: null
      observed_at: 2026-08-03
    evidence:
      - {source: src-anthropic-pricing-2026-08-03, excerpt_ref: 5, supports: false}
    conflicts:
      - positions:
          - statement: "Sonnet 5 uses the newer tokenizer (it is later than 4.7)"
            sources: [src-anthropic-pricing-2026-08-03]
          - statement: "Documentation attributes the tokenizer note explicitly only to Fable 5 among current models"
            sources: [src-anthropic-models-overview-2026-08-03]
        likely_cause: unexplained
        note: >
          The models overview attaches the tokenizer tooltip to Claude Fable 5
          specifically. The pricing page states the change applies to "Claude 4.7
          and later models". These are not obviously consistent for Sonnet 5.
          Resolving this changes effective cost by up to ~30%, which is larger
          than the entire introductory discount. Escalated as RG-001.
    cadence_days: 30
    status: published

# ── FIRST SCORED DIMENSION IN THE CORPUS ──
# Every dimension sat at not_scored from M1 to M6 because no admissible evidence
# existed. D8 now has a Class B source graded B-full at methodology depth, which
# is exactly the threshold EVIDENCE.md §4 sets. Nothing was relaxed to get here.
scores:
  - id: scr-claude-sonnet-5-d8
    schema_version: 1
    dimension: D8
    value: 3
    rationale: >
      Output throughput of 80.9 t/s is above the measured tier median of 74.0,
      but felt latency is unestablished because the only TTFT figure available is
      anomalous, so the dimension is scored on half its construct.
    via:
      model: ent-model-claude-sonnet-5
      config: "first-party API, measured from a single cloud region"
    evidence: [clm-claude-sonnet-5-020]
    as_of: 2026-08-04
    anchor_set_version: "EVALUATION v1.1"
    scored_by: atlas-editorial
    second_pass: null

claims_scores_note: >
  Score is 3 rather than 4 despite being above median, because D8 is defined as
  "latency and throughput as FELT, not as benchmarked" (EVALUATION §2). Throughput
  is established; the latency half is not. Scoring 4 on one measured axis would
  claim the dimension is better evidenced than it is.

  second_pass is null: no independent re-score has been performed. EVALUATION §6
  requires one, so this score is single-rater and must be read that way.

