# M5.1 population — AGENTS.md (L6/L5), DeepSeek V4 family (L1), and the
# institutions they require.

entities:

  # ── AGENTS.md — context format AND cross-vendor standard ────────────────
  - id: ent-format-agents-md
    schema_version: 1
    name: AGENTS.md
    aliases: [agents.md]
    slug_frozen_at: 2026-08-04
    layers: [L6, L5]
    roles: [context_format, protocol]
    slots: [context, interop]
    facets:
      placement: repository_root
      nested_resolution: nearest_wins
      governance: foundation
    made_by: ent-institution-agentic-ai-foundation
    status: active
    depth_priority: P0
    first_seen: 2026-08-04
    canonical_url: https://agents.md/
    summary: >
      Open format for repo-level coding-agent instructions, placed at repository
      root with nearest-file-wins resolution, supported across 20+ products.
    decision_questions:
      - q: Is there a cross-vendor standard for agent instructions?
        status: answered
      - q: Should I write AGENTS.md, CLAUDE.md, or both?
        status: open

    claims:
      - id: clm-format-agents-md-001
        schema_version: 2
        type: S
        temporal_kind: step
        subject: ent-format-agents-md
        predicate: format.placement_and_resolution
        statement: >
          Placed at the root of the repository; for monorepos an additional
          AGENTS.md goes inside each package. Agents read the nearest file in the
          directory tree, so the closest one takes precedence.
        value: {root: true, nested: true, resolution: "nearest wins"}
        temporal: {valid_from: unknown, valid_to: null, valid_precision: unknown, asserted_from: 2026-08-04, asserted_to: null, observed_at: 2026-08-04}
        evidence:
          - {source: src-agentsmd-2026-08-04, excerpt_ref: 0, supports: true}
          - {source: src-agentsmd-2026-08-04, excerpt_ref: 1, supports: true}
        cadence_days: 90
        status: draft

      - id: clm-format-agents-md-002
        schema_version: 2
        type: S
        temporal_kind: step
        subject: ent-format-agents-md
        predicate: format.cross_vendor_adoption
        statement: >
          Documented as supported by 23 named products spanning competing
          vendors, including OpenAI Codex, Google Jules and Gemini CLI, Cursor,
          VS Code, GitHub Copilot Coding Agent, Zed, Windsurf, Devin, JetBrains
          Junie, Aider, goose, opencode, RooCode, Amp, and Augment Code.
        value: {supporting_products: 23, spans_competing_vendors: true}
        temporal: {valid_from: unknown, valid_to: null, valid_precision: unknown, asserted_from: 2026-08-04, asserted_to: null, observed_at: 2026-08-04}
        evidence:
          - {source: src-agentsmd-2026-08-04, excerpt_ref: 2, supports: true}
        cadence_days: 60
        status: draft
        conflicts:
          - positions:
              - statement: "Vendor-published support list — a self-interested count of adopters"
                sources: [src-agentsmd-2026-08-04]
              - statement: "Whether each named product's support is complete, partial, or nominal is unverified"
                sources: [src-agentsmd-2026-08-04]
            likely_cause: incentive
            note: >
              A standard's own site listing adopters is the weakest possible
              evidence of real interoperability. The list establishes that these
              products CLAIM support, not that a file written for one works
              unmodified in another. That is RQ-15.

      - id: clm-format-agents-md-003
        schema_version: 2
        type: S
        temporal_kind: step
        subject: ent-format-agents-md
        predicate: governance.steward
        statement: >
          Stewarded by the Agentic AI Foundation under the Linux Foundation —
          i.e. vendor-neutral governance rather than single-vendor control.
        value: {steward: "Agentic AI Foundation", umbrella: "Linux Foundation"}
        temporal: {valid_from: unknown, valid_to: null, valid_precision: unknown, asserted_from: 2026-08-04, asserted_to: null, observed_at: 2026-08-04}
        evidence:
          - {source: src-agentsmd-2026-08-04, excerpt_ref: 3, supports: true}
        cadence_days: 180
        status: draft

    relationships:
      - predicate: made_by
        object: ent-institution-agentic-ai-foundation
        temporal_kind: static
        temporal: {valid_from: unknown, valid_to: null, asserted_from: 2026-08-04, asserted_to: null, observed_at: 2026-08-04}
        evidence: [clm-format-agents-md-003]
