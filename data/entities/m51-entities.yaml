      Single-vendor repo instruction file read at session start, paired with an
      automatic memory mechanism that accumulates learnings across sessions.
    claims:
      - id: clm-format-claude-md-001
        schema_version: 2
        type: S
        temporal_kind: step
        subject: ent-format-claude-md
        predicate: format.behaviour
        statement: >
          A markdown file at the project root, read at the start of every
          session. Paired with "auto memory", which saves learnings such as build
          commands and debugging insights across sessions without the user
          writing anything.
        value: {read_at_session_start: true, auto_memory: true}
        temporal: {valid_from: unknown, valid_to: null, valid_precision: unknown, asserted_from: 2026-08-04, asserted_to: null, observed_at: 2026-08-04}
        evidence:
          - {source: src-claude-code-overview-2026-08-04, excerpt_ref: 4, supports: true}
        cadence_days: 90
        status: published
    relationships:
      - predicate: made_by
        object: ent-institution-anthropic
        temporal_kind: static
        temporal: {valid_from: unknown, valid_to: null, asserted_from: 2026-08-04, asserted_to: null, observed_at: 2026-08-04}
        evidence: [clm-format-claude-md-001]
      - predicate: provides
        object: cap-session-persistence
        temporal_kind: step
        temporal: {valid_from: unknown, valid_to: null, asserted_from: 2026-08-04, asserted_to: null, observed_at: 2026-08-04}
        evidence: [clm-format-claude-md-001]
    review: {cadence_days: 90, last_reviewed: 2026-08-04, next_due: 2026-11-02}
    open_questions:
      - "Auto memory is a memory layer bundled into a harness. Whether it is comparable to a standalone memory layer is unresearched (Q40)."

