    canonical_url: https://platform.claude.com/docs/en/api/rate-limits
    summary: >
      Anthropic's first-party metered API. Tiered rate limits and monthly spend
      caps; cached input tokens do not count toward throughput limits.
    decision_questions:
      - q: Will rate limits bind before price does for my workload?
        status: answered
      - q: Does the Start-tier $500 monthly spend cap constrain me?
        status: answered

    claims:
      - id: clm-access-anthropic-api-001
        schema_version: 2
        type: S
        temporal_kind: step
        subject: ent-access-anthropic-api
        predicate: limits.monthly_spend_cap
        statement: >
          Monthly spend caps by usage tier: Start $500, Build $1,000, Scale
          $200,000. Once the cap is reached, API usage pauses until the next
          month unless a higher limit is requested. Custom tier has no cap.
        value: {start: 500, build: 1000, scale: 200000, custom: null, currency: USD}
        temporal: {valid_from: unknown, valid_to: null, valid_precision: unknown, asserted_from: 2026-08-03, asserted_to: null, observed_at: 2026-08-03}
        evidence:
          - {source: src-anthropic-rate-limits-2026-08-03, excerpt_ref: 0, supports: true}
        cadence_days: 60
        status: published

      - id: clm-access-anthropic-api-002
        schema_version: 2
        type: S
        temporal_kind: step
        subject: ent-access-anthropic-api
        predicate: limits.itpm_by_tier
        statement: >
          Input tokens per minute by tier. Start: Fable 5 500,000; Opus 5,
          Sonnet 5, and Haiku 4.5 each 2,000,000. Build: Fable 5 1,500,000;
          Opus 5 and Sonnet 5 each 5,000,000. Scale: Fable 5 4,000,000;
          Opus 5 and Sonnet 5 each 10,000,000.
        value:
          start: {fable_5: 500000, opus_5: 2000000, sonnet_5: 2000000, haiku_4_5: 2000000}
          build: {fable_5: 1500000, opus_5: 5000000, sonnet_5: 5000000}
          scale: {fable_5: 4000000, opus_5: 10000000, sonnet_5: 10000000}
        temporal: {valid_from: unknown, valid_to: null, valid_precision: unknown, asserted_from: 2026-08-03, asserted_to: null, observed_at: 2026-08-03}
        evidence:
          - {source: src-anthropic-rate-limits-2026-08-03, excerpt_ref: 1, supports: true}
          - {source: src-anthropic-rate-limits-2026-08-03, excerpt_ref: 2, supports: true}
          - {source: src-anthropic-rate-limits-2026-08-03, excerpt_ref: 3, supports: true}
        cadence_days: 60
        status: published

      - id: clm-access-anthropic-api-003
        schema_version: 2
        type: S
        temporal_kind: step
        subject: ent-access-anthropic-api
        predicate: limits.cache_reads_excluded_from_itpm
        statement: >
          Cache read tokens do not count toward ITPM rate limits for most models,
          making prompt caching a throughput lever as well as a cost lever.
          Anthropic's worked example: a 2,000,000 ITPM limit with an 80% cache
          hit rate processes an effective 10,000,000 input tokens per minute.
        value: {cache_reads_count_toward_itpm: false, exception: "Claude Haiku 3.5"}
        temporal: {valid_from: unknown, valid_to: null, valid_precision: unknown, asserted_from: 2026-08-03, asserted_to: null, observed_at: 2026-08-03}
        evidence:
          - {source: src-anthropic-rate-limits-2026-08-03, excerpt_ref: 4, supports: true}
          - {source: src-anthropic-rate-limits-2026-08-03, excerpt_ref: 5, supports: true}
        cadence_days: 60
        status: published

      - id: clm-access-anthropic-api-004
        schema_version: 2
        type: S
        temporal_kind: step
        subject: ent-access-anthropic-api
        predicate: limits.starting_limits_may_be_lower
        statement: >
          New organizations, and those with limited usage history, may start with
          limits BELOW the documented tier limits while account history is
          established. The published tables are therefore an upper bound for a
          new account, not the limits it will actually receive.
        value: {published_limits_are_upper_bound_for_new_accounts: true}
        temporal: {valid_from: unknown, valid_to: null, valid_precision: unknown, asserted_from: 2026-08-03, asserted_to: null, observed_at: 2026-08-03}
        evidence:
