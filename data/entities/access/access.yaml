  - id: ent-access-openrouter
    schema_version: 1
    name: OpenRouter
    aliases: []
    slug_frozen_at: 2026-08-03
    layers: [L2]
    roles: [aggregator]
    slots: [access]
    facets:
      billing_model: metered
      byok: unknown
    made_by: ent-institution-openrouter
    status: researching
    depth_priority: P0
    first_seen: 2026-08-03
    canonical_url: https://openrouter.ai/docs/features/provider-routing
    summary: >
      Multi-provider aggregator that load-balances requests across upstream
      providers, defaulting to price-weighted selection with configurable
      routing, quantization, and data-policy filters.
    decision_questions:
      - q: Does routing through an aggregator reduce vendor lock-in, or move it?
        status: open
      - q: Can I stop a router sending my work to a quantized endpoint?
        status: open

    claims:
      - id: clm-access-openrouter-001
        schema_version: 2
        type: S
        temporal_kind: step
        subject: ent-access-openrouter
        predicate: routing.default_strategy
        statement: >
          Default behaviour load balances across providers prioritizing price,
          via inverse-square price weighting — documented such that a provider at
          $1/M tokens is 9x more likely to be selected than one at $3/M.
          Providers with significant outages in the last 30 seconds are
          deprioritized; remaining providers act as fallbacks.
        value: {strategy: price_weighted_load_balance, weighting: inverse_square_price}
        temporal: {valid_from: unknown, valid_to: null, valid_precision: unknown, asserted_from: 2026-08-03, asserted_to: null, observed_at: 2026-08-03}
        evidence:
          - {source: src-openrouter-provider-routing-2026-08-03, excerpt_ref: 0, supports: true}
          - {source: src-openrouter-provider-routing-2026-08-03, excerpt_ref: 1, supports: true}
          - {source: src-openrouter-provider-routing-2026-08-03, excerpt_ref: 2, supports: true}
        cadence_days: 60
        status: draft        # reduced-fidelity source; cannot publish

      - id: clm-access-openrouter-002
        schema_version: 2
        type: S
        temporal_kind: step
        subject: ent-access-openrouter
        predicate: routing.controls
        statement: >
          Routing is controllable via order, allow_fallbacks (default true),
          require_parameters (default false), data_collection (default "allow"),
          zdr, quantizations, and sort (price / throughput / latency). Setting
          sort or order disables load balancing.
        value:
          parameters: [order, allow_fallbacks, require_parameters, data_collection, zdr, quantizations, sort]
          defaults: {allow_fallbacks: true, require_parameters: false, data_collection: "allow"}
        temporal: {valid_from: unknown, valid_to: null, valid_precision: unknown, asserted_from: 2026-08-03, asserted_to: null, observed_at: 2026-08-03}
        evidence:
          - {source: src-openrouter-provider-routing-2026-08-03, excerpt_ref: 3, supports: true}
        cadence_days: 60
        status: draft

    relationships:
      - predicate: made_by
        object: ent-institution-openrouter
        temporal_kind: static
        temporal: {valid_from: unknown, valid_to: null, asserted_from: 2026-08-03, asserted_to: null, observed_at: 2026-08-03}
        evidence: [clm-access-openrouter-001]
      - predicate: provides
        object: cap-model-routing
        temporal_kind: step
        temporal: {valid_from: unknown, valid_to: null, asserted_from: 2026-08-03, asserted_to: null, observed_at: 2026-08-03}
        evidence: [clm-access-openrouter-002]

    review: {cadence_days: 60, last_reviewed: 2026-08-03, next_due: 2026-10-02}
    open_questions:
      - "Both claims are DRAFT — the source was tool_extracted, not verbatim. Re-capture required before publication."
      - "Pricing/markup model not captured. Whether OpenRouter adds a margin over upstream prices is unknown and is the central cost question for this entity."
      - "The quantizations filter implies quantization VARIES across upstream providers for the same nominal model. That is the model_endpoint distinction (TAXONOMY §2 L1) appearing in a vendor's own API surface — strong structural corroboration, and it needs verbatim confirmation before we lean on it."
