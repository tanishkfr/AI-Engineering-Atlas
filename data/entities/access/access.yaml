"$schema": ../../schema/entity.schema.json
# L2 ACCESS entities. Per GRAPH.md §4.2, access ("who sells you inference") is
# deliberately separate from hosting ("who runs the compute"), because a router
# resells capacity it does not host — and when a host silently quantizes, the
# fault lies with the host, not the seller.

entities:

  - id: ent-access-anthropic-api
    schema_version: 1
    name: Claude API (first-party)
    aliases: [Anthropic API, Claude API]
    slug_frozen_at: 2026-08-03
    layers: [L2]
    roles: [first_party_api]
    slots: [access]
