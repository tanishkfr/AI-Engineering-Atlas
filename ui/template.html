<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aletheia — what evidence could be withdrawn before this should be</title>

<style>
/* ══ ALETHEIA — THE CIRCUIT ════════════════════════════════════════════════
   The epistemics ARE a boolean circuit, so they are drawn as one:

       conclusion = AND(claims)      -> series along a spine
       claim      = OR(sources)      -> parallel branches into one node
       source     = publisher & switch

   Series is conjunction. Parallel is disjunction. Nothing here is metaphor.

   Geometry carries the meaning, so there is no explanatory prose anywhere in
   this file. Two branches leaving the SAME rail are duplication — you can see
   they share an origin. A branch that never reaches a rail is derivation. A
   publisher rail is where a constitutive fact ORIGINATES, so it does not read
   as fragile. An open socket is a corroboration that could exist and does not.

   NOTHING ANIMATES. A circuit is open or closed. Transitions would be theatre.
   ═════════════════════════════════════════════════════════════════════════ */

:root{
  --face:#0B0C0D; --ink:#EAE7E1; --dim:#8C9095; --faint:#5E6266;
  --live:#E8A33D; --dead:#33383C; --socket:#7F8D96;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono",Menlo,Consolas,monospace;
}
:root[data-theme=light]{
  --face:#F2F0EB; --ink:#16171A; --dim:#4C5054; --faint:#7A7E82;
  --live:#8A5808; --dead:#CBC6BC; --socket:#4F646F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--face);color:var(--ink);font-family:var(--mono);
  font-size:13px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:none}
:focus-visible .hit{stroke:var(--live);stroke-width:2}

header{display:flex;align-items:baseline;gap:14px;padding:20px 30px 0;flex-wrap:wrap}
h1{font-size:12.5px;font-weight:600;letter-spacing:.34em}
.sub{font-size:11px;color:var(--faint);letter-spacing:.02em}
.grow{flex:1}
.hbtn{font-size:10px;letter-spacing:.14em;color:var(--dim);padding:5px 9px;
  border:1px solid var(--dead);border-radius:2px}
.hbtn:hover{color:var(--ink)}
.hbtn[disabled]{opacity:.3}

#stage{width:100%;padding:6px 18px 24px}
svg{width:100%;height:auto;display:block;touch-action:manipulation}

.wire{stroke-width:1.4;fill:none;stroke-linecap:square}
.wire.on{stroke:var(--live)}
.wire.off{stroke:var(--dead)}
.bus{stroke-width:2.6}
.hit{fill:transparent;stroke:transparent;cursor:pointer}
.node{fill:var(--live)}
.node.off{fill:var(--dead)}
.lamp-glass{fill:none;stroke-width:1.6}
.lamp-glass.on{stroke:var(--live);fill:var(--live);fill-opacity:.13}
.lamp-glass.off{stroke:var(--dead)}
.lamp-x{stroke-width:1.3}
.lamp-x.on{stroke:var(--live)}
.lamp-x.off{stroke:var(--dead)}
.sock{fill:none;stroke:var(--socket);stroke-width:1.4;stroke-dasharray:2.5 2.5}
text{font-family:var(--mono);fill:var(--dim)}
.lbl{font-size:9.5px;letter-spacing:.09em}
.lbl.on{fill:var(--dim)}
.lbl.off{fill:var(--dead)}
.pubname{font-size:10px;letter-spacing:.16em;fill:var(--ink)}
.pubname.off{fill:var(--dead)}
.model{font-size:11.5px;letter-spacing:.04em;fill:var(--ink)}
.model.off{fill:var(--dead)}
.price{font-size:13px;letter-spacing:.02em;fill:var(--live)}
.price.off{fill:var(--dead)}
footer{padding:0 30px 26px;font-size:10px;letter-spacing:.06em;color:var(--faint);
  display:flex;gap:20px;flex-wrap:wrap}
footer a{color:var(--dim)}
@media (max-width:700px){header,footer{padding-left:16px;padding-right:16px}#stage{padding:6px 8px 20px}}
</style>

<header>
  <h1>ALETHEIA</h1>
  <span class="sub">ἀλήθεια · unconcealment</span>
  <span class="grow"></span>
  <button class="hbtn" id="restore" disabled>CLOSE ALL</button>
  <button class="hbtn" id="theme">◐</button>
</header>

<div id="stage"></div>

<footer>
  <span id="fcount"></span><span id="fcal"></span><span class="grow"></span>
  <a href="https://github.com/tanishkfr/AI-Engineering-Atlas">source &amp; corpus</a>
  <span id="fgen"></span>
</footer>

<script>
const CORPUS=/*__CORPUS__*/null;
const $=s=>document.querySelector(s);
const NS="http://www.w3.org/2000/svg";
const E=(t,a)=>{const n=document.createElementNS(NS,t);
  for(const k in a) n.setAttribute(k,a[k]); return n};

/* ── the graph ─────────────────────────────────────────────────────────── */
const CACHE=CORPUS.cache_claim, WORK=CORPUS.workload_claim;
const TODAY=new Date().toISOString().slice(0,10);
const MODELS=CORPUS.models.map(m=>{
  const iv=m.intervals.find(x=>TODAY>=x.from&&TODAY<=x.to)||m.intervals[0];
  return{name:m.name,p:[iv.in,iv.cache,iv.out],claims:iv.claims.filter(c=>CORPUS.claims[c])};
});
const SHARED=[CACHE,WORK].filter(c=>CORPUS.claims[c]);
const srcOf=cid=>[...new Set((CORPUS.claims[cid].evidence||[])
  .map(e=>e.source).filter(s=>CORPUS.sources[s]))];
const pubOf=sid=>CORPUS.sources[sid].publisher;
const PUBS=[...new Set([...SHARED,...MODELS.flatMap(m=>m.claims)].flatMap(srcOf).map(pubOf))];

const S={withdrawn:new Set()};
const live=cid=>srcOf(cid).some(s=>!S.withdrawn.has(s));
const busOpen=p=>[...new Set([...SHARED,...MODELS.flatMap(m=>m.claims)].flatMap(srcOf))]
  .filter(s=>pubOf(s)===p).every(s=>S.withdrawn.has(s));
const supplyLive=()=>SHARED.every(live);
const lampLive=m=>supplyLive()&&m.claims.every(live);

const PRES=25e6, HIT=CORPUS.cache_hit,
      IO=(CORPUS.claims[WORK].statement.match(/([\d.]+)\s*:\s*1/)||[0,197.7])[1];
const price=m=>(PRES*(1-HIT)*m.p[0]+PRES*HIT*m.p[1]+(PRES/IO)*m.p[2])/1e6;

/* ── layout ────────────────────────────────────────────────────────────── */
const W=1200,H=534;
const BUS_Y=p=>44+PUBS.indexOf(p)*28;      /* publisher rails, horizontal, top */
const SUP_Y=214;                            /* supply bus — feeds every lamp   */
/* inset so the leftmost column's branch feet stay on canvas */
const CX=i=>MODELS.length<2?W/2:170+i*((W-250)/(MODELS.length-1));
const CLAIM_Y=(i)=>268+i*44;
const LAMP_Y=452;

function draw(){
  const svg=E("svg",{viewBox:"0 0 "+W+" "+H,role:"img",
    "aria-label":"Dependency circuit. Publisher rails at top, claims in series, one lamp per priced model."});

  const wire=(x1,y1,x2,y2,on,cls)=>svg.appendChild(
    E("line",{x1,y1,x2,y2,class:"wire "+(on?"on":"off")+(cls?" "+cls:"")}));
  const label=(x,y,t,on,anchor)=>{const n=E("text",{x,y,class:"lbl "+(on?"on":"off"),
    "text-anchor":anchor||"start"});n.textContent=t;svg.appendChild(n);return n};

  /* a switch: two terminals and a lever. Closed = bridged. Open = lifted. */
  function sw(x,y,sid,on){
    const g=E("g",{tabindex:"0",role:"switch","aria-checked":String(on),
      "aria-label":(on?"withdraw ":"restore ")+CORPUS.sources[sid].publisher+" "+
        (CORPUS.sources[sid].title||sid)});
    g.appendChild(E("circle",{cx:x-9,cy:y,r:2,class:"node"+(on?"":" off")}));
    g.appendChild(E("circle",{cx:x+9,cy:y,r:2,class:"node"+(on?"":" off")}));
    g.appendChild(E("line",{x1:x-9,y1:y,x2:on?x+9:x+5,y2:on?y:y-11,
      class:"wire "+(on?"on":"off")}));
    g.appendChild(E("rect",{x:x-16,y:y-16,width:32,height:30,class:"hit"}));
    g.style.cursor="pointer";
    g.onclick=()=>toggle(sid);
    g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle(sid)}};
    svg.appendChild(g); return g;
  }

  /* ── publisher rails ─────────────────────────────────────────────────── */
  PUBS.forEach(p=>{
    const y=BUS_Y(p), open=busOpen(p);
    wire(30,y,W-30,y,!open,"bus");
    const t=E("text",{x:30,y:y-9,class:"pubname"+(open?" off":"")});
    t.textContent=p.toUpperCase(); svg.appendChild(t);
    /* master switch: the whole publisher, in one gesture */
    const all=[...new Set([...SHARED,...MODELS.flatMap(m=>m.claims)].flatMap(srcOf))]
      .filter(s=>pubOf(s)===p);
    const g=E("g",{tabindex:"0",role:"switch","aria-checked":String(!open),
      "aria-label":(open?"restore ":"withdraw ")+p+" entirely"});
    g.appendChild(E("circle",{cx:64,cy:y,r:2.6,class:"node"+(open?" off":"")}));
    g.appendChild(E("circle",{cx:90,cy:y,r:2.6,class:"node"+(open?" off":"")}));
    g.appendChild(E("line",{x1:64,y1:y,x2:open?88:90,y2:open?y-14:y,
      class:"wire bus "+(open?"off":"on")}));
    g.appendChild(E("rect",{x:58,y:y-18,width:38,height:34,class:"hit"}));
    g.style.cursor="pointer";
    const flip=()=>{const every=all.every(s=>S.withdrawn.has(s));
      apply(()=>all.forEach(s=>every?S.withdrawn.delete(s):S.withdrawn.add(s)))};
    g.onclick=flip;
    g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};
    svg.appendChild(g);
  });

  /* ── branches into one claim node ────────────────────────────────────────
     Sources are grouped BY PUBLISHER and share a single foot on that rail.
     Two sources from one publisher therefore leave one point, bow apart and
     rejoin — a closed lens enclosing nothing. Two publishers give two feet on
     two rails. That difference IS corroboration versus duplication, drawn. */
  function branches(cid,nodeX,y,footX){
    const srcs=srcOf(cid), byPub={};
    srcs.forEach(s=>(byPub[pubOf(s)]=byPub[pubOf(s)]||[]).push(s));
    Object.keys(byPub).forEach((p,gi)=>{
      const grp=byPub[p], fx=footX+gi*30, py=BUS_Y(p);
      const anyOn=grp.some(s=>!S.withdrawn.has(s));
      wire(fx,py,fx,y,anyOn);                       /* one foot per publisher */
      grp.forEach((sid,k)=>{
        const ok=!S.withdrawn.has(sid);
        const off=(k-(grp.length-1)/2)*17;      /* bow apart, then rejoin */
        svg.appendChild(E("polyline",{class:"wire "+(ok?"on":"off"),
          points:`${fx},${y} ${fx+16},${y+off} ${nodeX-26},${y+off} ${nodeX-10},${y}`}));
        sw((fx+16+nodeX-26)/2, y+off, sid, ok);
      });
    });
    /* an unfilled socket: an independent corroboration that could exist here */
    if(CORPUS.claims[cid].type==="M"){
      svg.appendChild(E("circle",{cx:footX-34,cy:y,r:5,class:"sock"}));
      svg.appendChild(E("line",{x1:footX-29,y1:y,x2:footX-6,y2:y,class:"sock"}));
    }
    wire(nodeX-10,y,nodeX,y,live(cid));
  }

  /* ── the shared chain: claims that feed EVERY lamp, in series ────────── */
  const SNODE=820;
  let chainOn=true;
  SHARED.forEach((cid,i)=>{
    const on=live(cid), y=126+i*42;
    branches(cid,SNODE,y,500+i*34);
    svg.appendChild(E("circle",{cx:SNODE,cy:y,r:3,class:"node"+(on?"":" off")}));
    const t=label(SNODE+10,y+3.5,cid.replace(/^clm-usage-/,""),on);
    t.appendChild(E("title")).textContent=cid;
    if(i<SHARED.length-1) wire(SNODE,y,SNODE,126+(i+1)*42,on&&chainOn);
    if(!on) chainOn=false;
  });
  /* the chain terminates in the supply bus that feeds every column */
  const supOn=supplyLive();
  wire(SNODE,126+(SHARED.length-1)*42,SNODE,SUP_Y,supOn);
  wire(30,SUP_Y,W-30,SUP_Y,supOn,"bus");

  /* ── one column per priced model ─────────────────────────────────────── */
  MODELS.forEach((m,mi)=>{
    const cx=CX(mi), lit=lampLive(m);
    let prevY=SUP_Y, broken=!supOn;
    m.claims.forEach((cid,ci)=>{
      const y=CLAIM_Y(ci), on=live(cid);
      wire(cx,prevY,cx,y,!broken);          /* spine segment above this claim */
      branches(cid,cx,y,cx-116);
      svg.appendChild(E("circle",{cx,cy:y,r:3,class:"node"+(on?"":" off")}));
      const t=label(cx+10,y+3.5,"·"+cid.slice(-3),on);
      t.appendChild(E("title")).textContent=cid;
      if(!on) broken=true;                  /* series: a dead claim opens it  */
      prevY=y;
    });
    wire(cx,prevY,cx,LAMP_Y-18,!broken);

    /* the lamp */
    const g=E("g");
    g.appendChild(E("circle",{cx,cy:LAMP_Y,r:16,class:"lamp-glass "+(lit?"on":"off")}));
    g.appendChild(E("line",{x1:cx-11,y1:LAMP_Y-11,x2:cx+11,y2:LAMP_Y+11,
      class:"lamp-x "+(lit?"on":"off")}));
    g.appendChild(E("line",{x1:cx+11,y1:LAMP_Y-11,x2:cx-11,y2:LAMP_Y+11,
      class:"lamp-x "+(lit?"on":"off")}));
    svg.appendChild(g);
    const nm=E("text",{x:cx,y:LAMP_Y+40,class:"model"+(lit?"":" off"),"text-anchor":"middle"});
    nm.textContent=m.name; svg.appendChild(nm);
    const pr=E("text",{x:cx,y:LAMP_Y+60,class:"price"+(lit?"":" off"),"text-anchor":"middle"});
    pr.textContent=lit?"$"+price(m).toFixed(2):"—"; svg.appendChild(pr);
  });

  $("#stage").textContent="";
  $("#stage").appendChild(svg);
  $("#restore").disabled=S.withdrawn.size===0;
}

/* single mutation path; the drawing is a pure function of S */
function apply(mutate){ mutate(); draw(); }
function toggle(sid){ apply(()=>{
  S.withdrawn.has(sid)?S.withdrawn.delete(sid):S.withdrawn.add(sid)}); }
$("#restore").onclick=()=>apply(()=>S.withdrawn.clear());

if(matchMedia("(prefers-color-scheme:light)").matches)
  document.documentElement.setAttribute("data-theme","light");
$("#theme").onclick=()=>{const c=document.documentElement.getAttribute("data-theme")||"dark";
  document.documentElement.setAttribute("data-theme",c==="dark"?"light":"dark")};

const cal=CORPUS.calibration;
$("#fcount").textContent=CORPUS.counts.claims+" claims · "+CORPUS.counts.sources+" sources";
$("#fcal").textContent=Math.round(cal.dominant_share*100)+"% of citations are "+
  cal.dominant_publisher+"'s";
$("#fgen").textContent="built "+CORPUS.generated;
draw();
</script>
